<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chatbot</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <div class="bot-avatar">🤖</div>
        <div>
          <h1>AI Chatbot</h1>
          <p class="subtitle">Powered by Llama 3.1 via Groq</p>
        </div>
      </div>
      <button id="clear-btn" class="btn-secondary" title="Clear conversation">
        Clear chat
      </button>
    </header>

    <main id="chat-window" class="chat-window" aria-live="polite">
      <!-- Messages injected by JS -->
    </main>

    <footer class="input-area">
      <form id="chat-form">
        <input
          type="text"
          id="user-input"
          placeholder="Ask me anything..."
          autocomplete="off"
          required
          autofocus
        />
        <button type="submit" id="send-btn" aria-label="Send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
      <p class="hint">Enter to send • Powered by Groq (free tier)</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
